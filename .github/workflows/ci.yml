name: CI

# The graph (lint, linux and macOS in parallel, release archives on main and tags, one required gate) lives in
# the shared workflow; this file only says what is specific to dolly. A `v*` tag publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Aemi-Studio/aemi/.github/workflows/swift-tool.yml@ci/shared-tool-workflow
    permissions:
      contents: write
    with:
      tool: dolly
      macos-package-extra: |
        set -euo pipefail
        BIN="$(swift build -c release --show-bin-path)/dolly"
        VERSION="$("$BIN" --version)"
        # Fetch into a subdir, NOT the workspace root: the upload-artifact glob
        # `dolly-*.tar.gz` would otherwise sweep `dolly-minilm.tar.gz` (the raw
        # model input) up as a stray release asset.
        mkdir -p _model
        gh release download embedding-models-v1 --repo "$GITHUB_REPOSITORY" \
          --pattern 'dolly-minilm.tar.gz' --pattern 'dolly-minilm.tar.gz.sha256' \
          --dir _model --clobber
        EXPECTED="$(cut -d' ' -f1 _model/dolly-minilm.tar.gz.sha256)"
        ACTUAL="$(shasum -a 256 _model/dolly-minilm.tar.gz | cut -d' ' -f1)"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::MiniLM checksum mismatch (expected $EXPECTED, got $ACTUAL)"
          exit 1
        fi
        NAME="dolly-full-$VERSION-macos-arm64"
        mkdir -p "$NAME/Models"
        cp "$BIN" LICENSE README.md "$NAME/"
        # Same on macOS, where release builds keep their debug map
        # (measured on v0.7.0: 26 MiB -> 14 MiB). -S drops debug symbols,
        # -x drops non-global ones; both keep the binary runnable.
        strip -S -x "$NAME/dolly"
        tar -xzf _model/dolly-minilm.tar.gz -C "$NAME/Models"   # -> Models/MiniLM/...
        printf '%s\n' \
          '# Bundled model' \
          '' \
          'This archive bundles all-MiniLM-L6-v2 (Models/MiniLM), a sentence-embedding' \
          'model by the Sentence-Transformers authors, converted to Core ML.' \
          '' \
          'Licensed under the Apache License 2.0.' \
          'https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2' \
          '' \
          'dolly loads it automatically for --semantic when it sits next to the' \
          'executable. Delete Models/ to fall back to the on-device NLContextual' \
          'provider, or override with --embedding-bundle / DOLLY_EMBEDDING_BUNDLE.' \
          > "$NAME/THIRD_PARTY_NOTICES.md"
        tar -czf "$NAME.tar.gz" "$NAME"
        shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
        ls -lh "$NAME.tar.gz"
